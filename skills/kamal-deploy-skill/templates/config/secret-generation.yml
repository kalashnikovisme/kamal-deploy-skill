# Project secret-generation policy. Read by bin/secrets generate.
#
# This file contains NO secret values and is safe to commit. It only
# records, per secret name, which generation policy applies and which
# generator produces it - never the generated material itself.
#
# This is a TEMPLATE. When the Skill installs bin/secrets into a project,
# it populates a project-specific copy of this file from actual inspection
# of that project (real JWT algorithm, real accessories, real OAuth
# integrations) - it never ships this example file verbatim. Entries below
# illustrate the supported shapes only.
#
# policy: one of
#   local_generatable             - safe to generate here with a CSPRNG
#   infrastructure_generatable    - Kamal/Skill-owned infra credential, CSPRNG
#   framework_generatable         - framework ships its own generator for this
#   protocol_generatable          - needs protocol-specific tooling (not a
#                                    bare random string), e.g. a VAPID or SSH
#                                    key pair
#   provider_managed              - must be issued by an external provider;
#                                    bin/secrets generate always refuses
#   existing_value_must_be_preserved - a real value already exists and backs
#                                    production state; refuse even if the
#                                    backend currently holds a placeholder
#
# generator: the named function in bin/secrets that actually produces the
#   value for a *_generatable policy. Never inferred from the variable name.
#   random_symmetric_key  - HMAC/signing/session secrets (e.g. HS256 JWT)
#   random_password       - infrastructure-owned credentials (e.g. Postgres)
#   random_token          - opaque bearer/service tokens
#   vapid_key_pair        - EC P-256 key pair for Web Push (VAPID)
#
# bytes: entropy size for the generator, in raw bytes before encoding -
#   determined by inspecting the actual consumer (the signing algorithm,
#   the accessory's own requirements), never a fixed default applied blindly
#   to every secret.

JWT_SECRET:
  policy: local_generatable
  generator: random_symmetric_key
  bytes: 32 # derived from the project's actual HS256 usage - confirm before reuse

POSTGRES_PASSWORD:
  policy: infrastructure_generatable
  generator: random_password
  bytes: 24

API_SERVICE_TOKEN:
  policy: local_generatable
  generator: random_token
  bytes: 32

# A key pair: one generation action produces two related outputs. The
# private half is a secret primitive; the public half is clear configuration
# and is never written to the secrets backend.
VAPID_KEY_PAIR:
  policy: protocol_generatable
  generator: vapid_key_pair
  private_name: VAPID_PRIVATE_KEY
  public_name: VAPID_PUBLIC_KEY
  public_target: clear

# No generator - local generation always refuses; the value must come from
# the named provider's own console/dashboard.
GOOGLE_CLIENT_SECRET:
  policy: provider_managed

# A real value already backs production state (e.g. issued tokens depend on
# it). Generation refuses even if the backend currently holds a placeholder -
# a placeholder alone never authorizes replacing a preserved value.
LEGACY_SIGNING_KEY:
  policy: existing_value_must_be_preserved
